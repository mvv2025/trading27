 <linearGradient id="word" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#102FAD"/><stop offset="35%" stop-color="#0759D8"/><stop offset="70%" stop-color="#00A2FF"/><stop offset="100%" stop-color="#00DCE9"/></linearGradient>
