<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">Trading27 — marca de mercats</title>
<desc id="desc">t amb 27 en superíndex, nom Trading en blau turquesa, fletxa fina ascendent sobre les lletres r i i, sense tocar el text</desc>
<defs>
 <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0C2D9E"/><stop offset=".45" stop-color="#126BD1"/><stop offset="1" stop-color="#17D6DB"/></linearGradient>
 <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1638A8"/><stop offset=".62" stop-color="#129AE6"/><stop offset="1" stop-color="#19DBE1"/></linearGradient>
 <linearGradient id="sup" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0873D8"/><stop offset="1" stop-color="#17DDE0"/></linearGradient>
</defs>
<g font-family="Manrope,Arial,Helvetica,sans-serif" font-weight="800" letter-spacing="-9">
 <text x="40" y="447" font-size="330" fill="#0C2D9E">t</text>
 <text x="192" y="276" font-size="154" letter-spacing="-7" fill="url(#sup)">27</text>
 <text x="440" y="443" font-size="250" letter-spacing="-13" fill="url(#word)">Trading</text>
</g>
<g aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round">
 <!-- Thin upward trajectory: starts above 'r', ends above 'i', never touches the lettering. -->
 <path d="M 603 218 C 716 172, 865 161, 1042 109" stroke="url(#arrow)" stroke-width="9"/>
 <path d="M 1023 91 L 1070 98 L 1038 137 L 1042 110 Z" fill="#19CFE0" stroke="none"/>
</g>
</svg>