<title id="title">Trading27 — marca de mercats</title>
<desc id="desc">t amb 27 en superíndex, nom Trading amb degradat de blau reial a cian com a la referència, fletxa sòlida ascendent que neix a la dreta de la T, s'eleva sobre les lletres i acaba amb una punta destacada</desc>
